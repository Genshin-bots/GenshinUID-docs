name: Fumadocs (Next.js) Deployment

on:
  push:
    branches:
      - fumadocs
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: fumadocs
          fetch-depth: 0
          # 拉取 external/gsuid_hub submodule —— 主页内嵌「可交互控制台」Demo 的源码。
          # pnpm build 会在 submodule 内 yarn build:demo 并把产物烤进 public/hub/。
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 🚧 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Type check
        run: pnpm typecheck
        continue-on-error: true

      - name: 🚀 Build Next.js application
        env:
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          UMAMI_ENDPOINT: ${{ secrets.UMAMI_ENDPOINT }}
        run: pnpm build

      - name: 📦 Post-build (CNAME)
        run: pnpm postbuild

      - name: 🎉 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: docs.sayu-bot.com
          force_orphan: true
          keep_files: false
          commit_message: ${{ github.event.head_commit.message }}
          enable_jekyll: false
          disable_nojekyll: false
